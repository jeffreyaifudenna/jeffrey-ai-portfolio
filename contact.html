<style>
:root{
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus,var(--accent));outline-offset:3px;border-radius:4px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:16px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.topbar a{text-decoration:none;color:var(--muted)}
.topbar a:hover{color:var(--ink)}
header.post{padding-block:48px 24px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.05;margin:12px 0 16px;text-wrap:balance}
.lede{margin:0;color:var(--muted);text-wrap:pretty}
main{padding-block:8px 64px}
form{display:flex;flex-direction:column;gap:20px}
label{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input,textarea{font:400 17px/1.5 var(--body);letter-spacing:0;text-transform:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-color:color-mix(in srgb,var(--muted) 80%,var(--surface));border-radius:10px;padding:12px 14px;width:100%;box-sizing:border-box}
textarea{min-height:160px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent)}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button.send{align-self:flex-start;font:600 16px var(--body);padding:11px 22px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;transition:transform .15s}
button.send:hover{transform:translateY(-2px)}
button.send:disabled{opacity:.5;cursor:default;transform:none}
.status{margin:0;font-size:15px}
.status.err{color:var(--warn)}
.done{padding:20px 22px;outline:none;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.done h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 6px}
.done p{margin:0;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){button.send{transition:none}}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>

<body>
<div class="topbar"><div class="wrap"><a href="index.html">← All projects</a><span>JeffreyAiFudenna</span></div></div>

<header class="post"><div class="wrap">
  <div class="eyebrow">Contact</div>
  <h1>Say hello</h1>
  <p class="lede">Hiring, a project idea, or a question about something I built? Send a note and I'll reply by email.</p>
</div></header>

<main><div class="wrap">
  <form id="form" action="/api/contact" method="post" novalidate>
    <label>Name<input name="name" type="text" autocomplete="name" maxlength="100" required></label>
    <label>Email<input name="email" type="email" autocomplete="email" maxlength="200" required></label>
    <label>Message<textarea name="message" maxlength="5000" required></textarea></label>
    <label class="trap" aria-hidden="true">Website<input name="website" type="text" tabindex="-1" autocomplete="off"></label>
    <input type="hidden" name="t" value="">
    <button class="send" type="submit">Send message</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
  <div class="done" id="done" role="status" tabindex="-1" hidden>
    <h2>Message sent</h2>
    <p>Thanks. I'll get back to you soon.</p>
  </div>
</div></main>

<footer><div class="wrap"><span>JeffreyAiFudenna</span><span>Built with Claude</span></div></footer>

<script>
(function(){
  var form=document.getElementById('form'), status=document.getElementById('status'), btn=form.querySelector('.send'),
      done=document.getElementById('done'), loaded=Date.now();
  form.addEventListener('submit',function(e){
    e.preventDefault();
    form.elements.t.value=String(Date.now()-loaded);   /* time on page; the server ignores sends faster than a person can type */
    var d={}; new FormData(form).forEach(function(v,k){d[k]=v});
    if(!d.name.trim()||!d.message.trim()||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())){
      status.className='status err'; status.textContent='Please fill in your name, a valid email and a message.'; return;
    }
    btn.disabled=true; status.className='status'; status.textContent='Sending…';
    fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong.');})})
      .then(function(){form.hidden=true; done.hidden=false; done.focus();})
      .catch(function(err){
        btn.disabled=false; status.className='status err';
        status.textContent=err instanceof TypeError ? 'Could not reach the server. Check your connection and try again.' : err.message;
      });
  });
})();
</script>
</body>
</html>
